name: ci

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dashboard dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile dashboard
        run: python -m compileall -q app.py
      - name: Smoke test dashboard configuration
        run: |
          python - <<'PY'
          import os

          import pandas as pd

          import app

          os.environ.update(
              {
                  "POSTGRES_HOST": "localhost",
                  "POSTGRES_PORT": "5432",
                  "POSTGRES_DB": "nasa_etl",
                  "POSTGRES_USER": "reader",
                  "POSTGRES_PASSWORD": "safe",
              }
          )
          config = app.get_database_config()
          assert config.host == "localhost"
          assert config.port == 5432

          frame = pd.DataFrame(
              [
                  {
                      "close_approach_date": "invalid",
                      "created_at": None,
                      "relative_velocity_km_s": None,
                      "details_json": None,
                      "alert_tag": None,
                      "is_potentially_hazardous_asteroid": False,
                  }
              ]
          )
          assert app.prepare_data(frame).loc[0, "risk_level"] == "MONITORAMENTO"
          PY

  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ETL test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --constraint https://raw.githubusercontent.com/apache/airflow/constraints-2.9.0/constraints-3.11.txt -r requirements-dev.txt
      - name: Run ETL tests
        env:
          PYTHONPATH: ${{ github.workspace }}/airflow:${{ github.workspace }}
        run: pytest
