apiVersion: 1

datasources:
  - name: NASA PostgreSQL
    uid: nasa-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: $POSTGRES_USER
    database: $POSTGRES_DB
    isDefault: true
    editable: false
    jsonData:
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
    secureJsonData:
      password: $POSTGRES_PASSWORD
